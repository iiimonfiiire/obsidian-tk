name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches manifest and versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const tag = process.env.TAG;
            const manifest = JSON.parse(require("fs").readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(require("fs").readFileSync("versions.json", "utf8"));
            if (manifest.version !== tag) {
              console.error(`tag ${tag} does not match manifest.json version ${manifest.version}`);
              process.exit(1);
            }
            if (!(tag in versions)) {
              console.error(`versions.json has no entry for ${tag}`);
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes "Release $TAG"
